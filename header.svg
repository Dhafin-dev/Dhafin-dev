<svg fill="none" viewBox="0 0 800 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; position: relative;">
      
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');

        .header-wrap {
          position: relative;
          width: 100%;
          max-width: 800px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: transparent;
        }

        .top-tag {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 1px;
          color: #475569;
          background: rgba(15, 23, 42, 0.06);
          border: 1px solid rgba(15, 23, 42, 0.14);
          padding: 3px 12px;
          border-radius: 20px;
          margin-bottom: 8px;
          text-transform: uppercase;
        }

        .status-dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: #10b981;
        }

        .name-title {
          font-family: 'Outfit', sans-serif;
          font-size: 46px;
          font-weight: 900;
          margin: 0 0 6px 0;
          letter-spacing: -0.02em;
          background: linear-gradient(135deg, #0284c7 0%, #4338ca 50%, #d97706 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.22));
        }

        .subtitle {
          font-family: 'Space Grotesk', monospace;
          font-size: 14px;
          font-weight: 600;
          color: #334155;
          margin-bottom: 15px;
          letter-spacing: 0.3px;
          filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.08));
        }

        .subtitle span {
          color: #d97706;
          font-weight: 800;
        }

        .badge-row {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 10px;
          flex-wrap: wrap;
        }

        .badge-pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 6px 14px;
          border-radius: 50px;
          font-size: 12px;
          font-weight: 700;
          font-family: 'Space Grotesk', monospace;
          letter-spacing: 0.3px;
          box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .badge-gold {
          background: rgba(245, 158, 11, 0.08);
          border: 1.5px solid #d97706;
          color: #b45309;
        }

        .badge-blue {
          background: rgba(37, 99, 235, 0.08);
          border: 1.5px solid #2563eb;
          color: #1d4ed8;
        }

        .badge-emerald {
          background: rgba(16, 185, 129, 0.08);
          border: 1.5px solid #059669;
          color: #047857;
        }
      </style>

      <div class="header-wrap">
        <div class="top-tag">
          <span class="status-dot"></span>
          UNAIR NODE // SYSTEMS DEVELOPER &amp; RESEARCHER
        </div>
        <h1 class="name-title">Ahmad Dhafin Al Farisy</h1>
        <div class="subtitle">
          🎓 Undergraduate Information Systems @ <span>Universitas Airlangga</span> • Class of 2024
        </div>
        <div class="badge-row">
          <span class="badge-pill badge-gold">👑 Duta FST UNAIR 2026</span>
          <span class="badge-pill badge-blue">🥇 2x International Gold Medalist</span>
          <span class="badge-pill badge-emerald">🌐 EF SET C2 Proficient (84/100)</span>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>
