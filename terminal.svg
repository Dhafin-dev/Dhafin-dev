<svg fill="none" viewBox="0 0 800 410" width="100%" height="410" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; padding: 10px 20px; box-sizing: border-box; display: flex; justify-content: center; align-items: center;">
      
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');

        .terminal-window {
          width: 100%;
          max-width: 740px;
          border-radius: 18px;
          background: linear-gradient(135deg, rgba(8, 14, 26, 0.96) 0%, rgba(3, 7, 18, 0.98) 100%);
          border: 1px solid rgba(0, 243, 255, 0.35);
          box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 243, 255, 0.15), inset 0 0 20px rgba(0, 243, 255, 0.04);
          font-family: 'JetBrains Mono', monospace;
          overflow: hidden;
          position: relative;
        }

        .scanline {
          position: absolute;
          inset: 0;
          background: linear-gradient(to bottom, transparent, rgba(0, 243, 255, 0.08), transparent);
          opacity: 0;
          animation: scan 4s ease-in-out infinite;
          pointer-events: none;
          z-index: 10;
        }

        @keyframes scan {
          0% { transform: translateY(-100%); opacity: 0; }
          30% { opacity: 0.6; }
          70% { opacity: 0.3; }
          100% { transform: translateY(100%); opacity: 0; }
        }

        .terminal-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 12px 18px;
          border-bottom: 1px solid rgba(0, 243, 255, 0.18);
          background: rgba(4, 9, 20, 0.7);
        }

        .traffic-dots { display: flex; gap: 7px; }
        .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
        .dot-red { background: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.6); }
        .dot-yellow { background: #f59e0b; box-shadow: 0 0 6px rgba(245, 158, 11, 0.6); }
        .dot-green { background: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.6); }

        .terminal-title {
          font-size: 12px;
          color: #94a3b8;
          font-weight: 500;
          letter-spacing: 0.5px;
        }

        .terminal-body {
          padding: 20px 24px;
          font-size: 13px;
          line-height: 1.65;
          color: #cbd5e1;
        }

        .prompt {
          color: #00f3ff;
          font-weight: 700;
          text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
        }

        .cmd {
          color: #f8fafc;
          font-weight: 600;
        }

        .res-text {
          color: #94a3b8;
          margin-bottom: 12px;
          padding-left: 14px;
        }

        .highlight-gold { color: #fbbf24; font-weight: 600; }
        .highlight-cyan { color: #00f3ff; font-weight: 600; text-shadow: 0 0 8px rgba(0, 243, 255, 0.4); }
        .highlight-green { color: #34d399; font-weight: 600; }
        .highlight-purple { color: #c084fc; font-weight: 600; }

        .cursor-blink {
          display: inline-block;
          width: 8px;
          height: 14px;
          background: #00f3ff;
          vertical-align: middle;
          margin-left: 4px;
          animation: blink 1s step-end infinite;
          box-shadow: 0 0 10px #00f3ff;
        }

        @keyframes blink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0; }
        }
      </style>

      <div class="terminal-window">
        <div class="scanline"></div>
        
        <div class="terminal-header">
          <div class="traffic-dots">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
          </div>
          <div class="terminal-title">dhafin@unair-node: ~ (zsh)</div>
          <div style="width: 45px;"></div>
        </div>

        <div class="terminal-body">
          <div>
            <span class="prompt">dhafin@unair:~$</span> <span class="cmd">whoami</span>
          </div>
          <div class="res-text">
            &gt; <span class="highlight-cyan">Ahmad Dhafin Al Farisy</span> (Undergraduate Researcher &amp; Systems Developer)
          </div>

          <div>
            <span class="prompt">dhafin@unair:~$</span> <span class="cmd">cat current_status.json</span>
          </div>
          <div class="res-text">
            &gt; <span class="highlight-gold">Role:</span> Duta FST UNAIR 2026 | BEM FST | SDGs Centre UNAIR<br/>
            &gt; <span class="highlight-gold">Affiliation:</span> Universitas Airlangga (Class of 2024–2028)<br/>
            &gt; <span class="highlight-gold">Honors:</span> 2x International Gold Medals (ISIF 2024 &amp; I2ASPO 2024)
          </div>

          <div>
            <span class="prompt">dhafin@unair:~$</span> <span class="cmd">get-certifications --all</span>
          </div>
          <div class="res-text">
            &gt; <span class="highlight-green">English:</span> EF SET C2 Proficient (84/100) &amp; ELPT UNAIR 557 pts<br/>
            &gt; <span class="highlight-green">Indonesian:</span> UKBI 703 (Predikat Sangat Unggul - Kemendikbud)
          </div>

          <div>
            <span class="prompt">dhafin@unair:~$</span> <span class="cmd">curl -s https://dhafin-dev.github.io</span> <span class="cursor-blink"></span>
          </div>
        </div>

      </div>

    </div>
  </foreignObject>
</svg>
