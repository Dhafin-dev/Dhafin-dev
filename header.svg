<svg fill="none" viewBox="0 0 800 230" width="100%" height="230" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; box-sizing: border-box; padding: 10px 14px; font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');

        .dark-hero {
          position: relative;
          width: 100%;
          max-width: 770px;
          background: linear-gradient(145deg, #161b22 0%, #0d1117 100%);
          border: none;
          border-radius: 18px;
          padding: 24px 26px;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
          overflow: hidden;
        }

        .top-tag {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 1px;
          color: #8b949e;
          background: #21262d;
          border: none;
          padding: 4px 12px;
          border-radius: 20px;
          margin-bottom: 10px;
          text-transform: uppercase;
        }

        .status-dot {
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: #2ea043;
        }

        .name-title {
          font-family: 'Outfit', sans-serif;
          font-size: 42px;
          font-weight: 900;
          margin: 0 0 6px 0;
          letter-spacing: -0.02em;
          background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #fbbf24 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .subtitle {
          font-family: 'Space Grotesk', monospace;
          font-size: 13.5px;
          font-weight: 600;
          color: #8b949e;
          margin-bottom: 16px;
          letter-spacing: 0.3px;
        }

        .subtitle span {
          color: #f59e0b;
          font-weight: 700;
        }

        .badge-row {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 10px;
          flex-wrap: wrap;
        }

        .badge-pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 6px 14px;
          border-radius: 50px;
          font-size: 12px;
          font-weight: 700;
          font-family: 'Space Grotesk', monospace;
          letter-spacing: 0.3px;
          border: none;
        }

        .badge-gold {
          background: rgba(245, 158, 11, 0.16);
          color: #fbbf24;
        }

        .badge-blue {
          background: rgba(56, 189, 248, 0.16);
          color: #38bdf8;
        }

        .badge-emerald {
          background: rgba(16, 185, 129, 0.16);
          color: #34d399;
        }
      </style>

      <div class="dark-hero">
        <div class="top-tag">
          <span class="status-dot"></span>
          UNAIR NODE // SYSTEMS DEVELOPER &amp; RESEARCHER
        </div>
        <h1 class="name-title">AHMAD DHAFIN AL FARISY</h1>
        <div class="subtitle">
          Undergraduate Information Systems @ <span>Universitas Airlangga</span> • Class of 2024
        </div>
        <div class="badge-row">
          <span class="badge-pill badge-gold">👑 Duta FST UNAIR 2026</span>
          <span class="badge-pill badge-blue">🥇 2x International Gold Medalist</span>
          <span class="badge-pill badge-emerald">🌐 EF SET C2 Proficient (84/100)</span>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>
