<svg fill="none" viewBox="0 0 800 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; box-sizing: border-box; padding: 4px; font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');

        .bento-hero {
          position: relative;
          width: 100%;
          max-width: 790px;
          height: 100%;
          background: linear-gradient(135deg, #090e1a 0%, #040711 50%, #020408 100%);
          background-image: radial-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 1px);
          background-size: 18px 18px;
          border: 1px solid rgba(0, 243, 255, 0.32);
          border-radius: 20px;
          padding: 22px 24px;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          box-shadow: inset 0 0 25px rgba(0, 243, 255, 0.05);
          overflow: hidden;
        }

        .top-tag {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 1px;
          color: #38bdf8;
          background: rgba(0, 243, 255, 0.08);
          border: 1px solid rgba(0, 243, 255, 0.25);
          padding: 3px 12px;
          border-radius: 20px;
          margin-bottom: 8px;
          text-transform: uppercase;
        }

        .status-dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: #10b981;
          box-shadow: 0 0 6px #10b981;
        }

        .name-title {
          font-family: 'Outfit', sans-serif;
          font-size: 40px;
          font-weight: 900;
          margin: 0 0 6px 0;
          letter-spacing: -0.02em;
          background: linear-gradient(135deg, #00f3ff 0%, #3b82f6 50%, #f59e0b 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 0 16px rgba(0, 243, 255, 0.45));
          animation: titleGlow 4s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
          0% { filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.35)); }
          100% { filter: drop-shadow(0 0 22px rgba(0, 243, 255, 0.65)); }
        }

        .subtitle {
          font-family: 'Space Grotesk', monospace;
          font-size: 13.5px;
          font-weight: 600;
          color: #94a3b8;
          margin-bottom: 15px;
          letter-spacing: 0.3px;
        }

        .subtitle span {
          color: #f59e0b;
          font-weight: 700;
        }

        .badge-row {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 10px;
          flex-wrap: wrap;
        }

        .badge-pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 5px 14px;
          border-radius: 50px;
          font-size: 12px;
          font-weight: 700;
          font-family: 'Space Grotesk', monospace;
          letter-spacing: 0.3px;
        }

        .badge-gold {
          background: rgba(245, 158, 11, 0.12);
          border: 1px solid rgba(245, 158, 11, 0.5);
          color: #fbbf24;
          box-shadow: 0 0 10px rgba(245, 158, 11, 0.12);
        }

        .badge-cyan {
          background: rgba(0, 243, 255, 0.12);
          border: 1px solid rgba(0, 243, 255, 0.5);
          color: #00f3ff;
          box-shadow: 0 0 10px rgba(0, 243, 255, 0.15);
        }

        .badge-emerald {
          background: rgba(16, 185, 129, 0.12);
          border: 1px solid rgba(16, 185, 129, 0.5);
          color: #34d399;
          box-shadow: 0 0 10px rgba(16, 185, 129, 0.12);
        }
      </style>

      <div class="bento-hero">
        <div class="top-tag">
          <span class="status-dot"></span>
          UNAIR NODE // SYSTEMS DEVELOPER &amp; RESEARCHER
        </div>
        <h1 class="name-title">AHMAD DHAFIN AL FARISY</h1>
        <div class="subtitle">
          Undergraduate Information Systems @ <span>Universitas Airlangga</span> • Class of 2024
        </div>
        <div class="badge-row">
          <span class="badge-pill badge-gold">👑 Duta FST UNAIR 2026</span>
          <span class="badge-pill badge-cyan">🥇 2x International Gold Medalist</span>
          <span class="badge-pill badge-emerald">🌐 EF SET C2 Proficient (84/100)</span>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>
