<svg fill="none" viewBox="0 0 800 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; position: relative;">
      
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap');

        .header-container {
          position: relative;
          z-index: 2;
          width: 100%;
          max-width: 800px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }

        .name-title {
          font-family: 'Outfit', sans-serif;
          font-size: 46px;
          font-weight: 900;
          margin: 0 0 6px 0;
          letter-spacing: -0.02em;
          background: linear-gradient(135deg, #00f3ff 0%, #3b82f6 50%, #f59e0b 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 0 16px rgba(0, 243, 255, 0.45));
          animation: titleGlow 4s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
          0% { filter: drop-shadow(0 0 12px rgba(0, 243, 255, 0.35)); }
          100% { filter: drop-shadow(0 0 24px rgba(0, 243, 255, 0.65)); }
        }

        .subtitle {
          font-family: 'Space Grotesk', monospace;
          font-size: 14px;
          font-weight: 600;
          color: #94a3b8;
          margin-bottom: 14px;
          letter-spacing: 0.5px;
        }

        .subtitle span {
          color: #f59e0b;
          font-weight: 700;
        }

        .badge-row {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 10px;
          flex-wrap: wrap;
        }

        .badge-pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 6px 14px;
          border-radius: 50px;
          font-size: 12px;
          font-weight: 700;
          font-family: 'Space Grotesk', monospace;
          letter-spacing: 0.3px;
          transition: all 0.2s ease;
        }

        .badge-gold {
          background: rgba(245, 158, 11, 0.1);
          border: 1px solid rgba(245, 158, 11, 0.45);
          color: #fbbf24;
          box-shadow: 0 0 12px rgba(245, 158, 11, 0.15);
        }

        .badge-cyan {
          background: rgba(0, 243, 255, 0.1);
          border: 1px solid rgba(0, 243, 255, 0.45);
          color: #00f3ff;
          box-shadow: 0 0 12px rgba(0, 243, 255, 0.2);
        }

        .badge-emerald {
          background: rgba(16, 185, 129, 0.1);
          border: 1px solid rgba(16, 185, 129, 0.45);
          color: #34d399;
          box-shadow: 0 0 12px rgba(16, 185, 129, 0.15);
        }
      </style>

      <div class="header-container">
        <h1 class="name-title">Ahmad Dhafin Al Farisy</h1>
        <div class="subtitle">
          🎓 Undergraduate Information Systems @ <span>Universitas Airlangga</span> • Class of 2024
        </div>
        <div class="badge-row">
          <span class="badge-pill badge-gold">👑 Duta FST UNAIR 2026</span>
          <span class="badge-pill badge-cyan">🥇 2x International Gold Medalist</span>
          <span class="badge-pill badge-emerald">🌐 EF SET C2 Proficient (84/100)</span>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>
