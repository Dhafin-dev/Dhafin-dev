<svg fill="none" viewBox="0 0 800 205" width="100%" height="205" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center; font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; position: relative; padding: 24px 0 0 0; box-sizing: border-box;">
      
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');

        .header-wrap {
          position: relative;
          width: 100%;
          max-width: 800px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: transparent;
        }

        .top-tag {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.5px;
          color: #475569;
          background: rgba(15, 23, 42, 0.06);
          border: 1px solid rgba(15, 23, 42, 0.14);
          padding: 4px 14px;
          border-radius: 20px;
          margin-bottom: 8px;
        }

        .status-dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: #10b981;
        }

        .name-title {
          font-family: 'Outfit', sans-serif;
          font-size: 46px;
          font-weight: 900;
          margin: 0 0 6px 0;
          letter-spacing: -0.02em;
          background: linear-gradient(135deg, #0284c7 0%, #4338ca 50%, #d97706 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.22));
        }

        .subtitle {
          font-family: 'Space Grotesk', monospace;
          font-size: 14px;
          font-weight: 600;
          color: #334155;
          margin-bottom: 14px;
          letter-spacing: 0.3px;
          filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.08));
        }

        .subtitle span {
          color: #d97706;
          font-weight: 800;
        }

        .badge-row {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 10px;
          flex-wrap: wrap;
        }

        .badge-pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 6px 14px;
          border-radius: 50px;
          font-size: 12px;
          font-weight: 700;
          font-family: 'Space Grotesk', monospace;
          letter-spacing: 0.3px;
          box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .badge-cyan {
          background: rgba(14, 165, 233, 0.08);
          border: 1.5px solid #0284c7;
          color: #0369a1;
        }

        .badge-indigo {
          background: rgba(99, 102, 241, 0.08);
          border: 1.5px solid #4f46e5;
          color: #4338ca;
        }

        .badge-location {
          background: rgba(100, 116, 139, 0.08);
          border: 1.5px solid #64748b;
          color: #334155;
        }
      </style>

      <div class="header-wrap">
        <div class="top-tag">
          <span class="status-dot"></span>
          Currently Learning Data Science, Open for Collaboration
        </div>
        <h1 class="name-title">Ahmad Dhafin Al Farisy</h1>
        <div class="subtitle">
          ⚡ Building Innovation, <span>Creating Impact!</span>
        </div>
        <div class="badge-row">
          <span class="badge-pill badge-cyan">💻 Systems &amp; Software Developer</span>
          <span class="badge-pill badge-indigo">🤖 Robotics &amp; IoT Specialist</span>
          <span class="badge-pill badge-location">📍 Surabaya, Indonesia</span>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>
