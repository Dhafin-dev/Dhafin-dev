<svg fill="none" viewBox="0 0 800 230" width="100%" height="230" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; position: relative; box-sizing: border-box; padding: 4px;">
      
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap');

        .header-box {
          position: relative;
          z-index: 2;
          width: 100%;
          max-width: 790px;
          background: linear-gradient(145deg, #152238 0%, #0d1527 45%, #050811 100%);
          border-top: 2px solid rgba(96, 165, 250, 0.7);
          border-left: 2px solid rgba(96, 165, 250, 0.4);
          border-right: 2px solid rgba(15, 23, 42, 0.9);
          border-bottom: 3px solid rgba(2, 4, 10, 0.95);
          border-radius: 20px;
          padding: 26px 20px;
          box-sizing: border-box;
          box-shadow: inset 1px 1px 1px rgba(255, 255, 255, 0.15), inset -1px -2px 2px rgba(0, 0, 0, 0.7);
          overflow: hidden;
        }

        .name-title {
          font-family: 'Outfit', sans-serif;
          font-size: 38px;
          font-weight: 900;
          margin: 0 0 8px 0;
          letter-spacing: -0.02em;
          background: linear-gradient(135deg, #60a5fa 0%, #4f46e5 50%, #f59e0b 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 0 16px rgba(79, 70, 229, 0.4));
          animation: glowPulse 3.5s ease-in-out infinite alternate;
        }

        @keyframes glowPulse {
          0% { filter: drop-shadow(0 0 12px rgba(96, 165, 250, 0.3)); }
          100% { filter: drop-shadow(0 0 22px rgba(79, 70, 229, 0.6)); }
        }

        .subtitle {
          font-family: 'Space Grotesk', monospace;
          font-size: 14px;
          font-weight: 600;
          color: #94a3b8;
          margin-bottom: 16px;
          letter-spacing: 0.5px;
        }

        .subtitle span {
          color: #f59e0b;
          font-weight: 700;
        }

        .badge-row {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 10px;
          flex-wrap: wrap;
        }

        .badge-pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 6px 14px;
          border-radius: 50px;
          font-size: 12px;
          font-weight: 700;
          font-family: 'Space Grotesk', monospace;
          letter-spacing: 0.3px;
          border-top: 1px solid rgba(255, 255, 255, 0.15);
          border-bottom: 2px solid rgba(0, 0, 0, 0.4);
          box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .badge-gold {
          background: rgba(245, 158, 11, 0.15);
          border-left: 1px solid rgba(245, 158, 11, 0.5);
          border-right: 1px solid rgba(245, 158, 11, 0.3);
          color: #fbbf24;
        }

        .badge-sapphire {
          background: rgba(37, 99, 235, 0.18);
          border-left: 1px solid rgba(37, 99, 235, 0.5);
          border-right: 1px solid rgba(37, 99, 235, 0.3);
          color: #60a5fa;
        }

        .badge-emerald {
          background: rgba(16, 185, 129, 0.15);
          border-left: 1px solid rgba(16, 185, 129, 0.5);
          border-right: 1px solid rgba(16, 185, 129, 0.3);
          color: #34d399;
        }
      </style>

      <div class="header-box">
        <h1 class="name-title">AHMAD DHAFIN AL FARISY</h1>
        <div class="subtitle">
          Undergraduate Information Systems @ <span>Universitas Airlangga</span> • Class of 2024
        </div>
        <div class="badge-row">
          <span class="badge-pill badge-gold">👑 Duta FST UNAIR 2026</span>
          <span class="badge-pill badge-sapphire">🥇 2x International Gold Medalist</span>
          <span class="badge-pill badge-emerald">🌐 EF SET C2 Proficient (84/100)</span>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>
